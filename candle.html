<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <title>Вальдѣмаръ Бубѣнъ — Алтарь За Стѣной</title>
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-select=no">
    <meta name="theme-color" content="#050201">
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; }
        
        body, html {
            width: 100%;
            height: 100%;
            overflow: hidden;
            background-color: #050201;
            font-family: "Georgia", "Times New Roman", serif;
            user-select: none;
            -webkit-user-select: none;
        }

        
        .shrine-background {
            position: fixed;
            top: 0; left: 0; width: 100vw; height: 100vh;
            background-image: url('candle.jpeg');
            background-size: cover;
            background-position: center 20%;
            background-repeat: no-repeat;
            filter: brightness(0.14) contrast(1.25) sepia(35%) drop-shadow(0 0 50px rgba(0,0,0,1));
            z-index: 1;
            transform: scale(1.02);
        }

        
        .shrine-shadow-overlay {
            position: fixed;
            top: 0; left: 0; width: 100vw; height: 100vh;
            background: radial-gradient(circle at 50% 30%, transparent 10%, rgba(5, 2, 1, 0.85) 55%, #050201 100%);
            z-index: 2;
            pointer-events: none;
        }

        
        .red-church-floor {
            position: fixed;
            bottom: 0; left: 0; width: 100vw; height: 35vh;
            z-index: 3;
            background: linear-gradient(180deg, #1f0504 0%, #120202 30%, #050000 100%);
            border-top: 3px double #caa148;
            box-shadow: inset 0 20px 40px rgba(0,0,0,0.9), 0 -10px 30px rgba(140, 42, 26, 0.15);
        }

       
        .floor-patina {
            position: absolute;
            top: 0; left: 0; width: 100%; height: 100%;
            opacity: 0.07;
            mix-blend-mode: overlay;
            background-image: url("data:image/svg+xml,%3Csvg width='120' height='120' viewBox='0 0 120 120' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='n'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='0.8' numOctaves='4' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='120' height='120' filter='url(%23n)'/%3E%3C/svg%3E");
        }

       
        .shrine-stage {
            position: relative;
            width: 100%;
            height: 100%;
            z-index: 10;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
            align-items: center;
            padding: 40px 20px;
        }

       
        .instruction-banner {
            font-size: 13px;
            letter-spacing: 6px;
            text-transform: uppercase;
            color: #caa148;
            text-shadow: 0 0 12px rgba(212, 175, 55, 0.6), 0 2px 4px #000;
            border: 1px solid rgba(202, 161, 72, 0.25);
            padding: 12px 28px;
            background: rgba(13, 5, 2, 0.75);
            box-shadow: 0 10px 25px rgba(0,0,0,0.8);
            margin-top: 10px;
            max-width: 90%;
            text-align: center;
        }

       
        .hanging-lamp-container {
            position: absolute;
            left: 10%;
            top: 0;
            height: 60vh;
            width: 60px;
            display: flex;
            flex-direction: column;
            align-items: center;
            pointer-events: none;
        }
        .lamp-chain {
            width: 3px;
            flex-grow: 1;
            background: linear-gradient(180deg, #1a0f03, #caa148, #2b1a07);
            border-left: 1px solid #110902;
            box-shadow: 0 0 8px rgba(0,0,0,0.8);
        }
        .lamp-body {
            width: 50px;
            height: 65px;
            background: linear-gradient(135deg, #422f12 0%, #caa148 40%, #1f1405 100%);
            border: 2px solid #1a1003;
            border-radius: 50% 50% 20% 20% / 30% 30% 70% 70%;
            position: relative;
            box-shadow: 0 15px 25px rgba(0,0,0,0.9);
            display: flex;
            justify-content: center;
        }
        .lamp-glass {
            position: absolute;
            top: 8px; width: 34px; height: 32px;
            background: radial-gradient(circle at center, #ff0055 0%, #800020 70%, #300008 100%);
            border-radius: 50% 50% 40% 40%;
            border: 1px solid #1a0005;
            box-shadow: inset 0 0 10px #000, 0 0 15px rgba(255, 0, 85, 0.3);
        }
        .lamp-wick-flame {
            position: absolute;
            top: -2px; left: 13px;
            width: 8px; height: 14px;
            background: radial-gradient(ellipse at bottom, #fff 0%, #ff8c00 50%, transparent 100%);
            border-radius: 50% 50% 20% 20%;
            box-shadow: 0 0 12px #ff8c00, 0 0 4px #fff;
            animation: lampFlicker 0.12s ease-in-out infinite alternate;
        }

        
        .altar-podium-zone {
            position: absolute;
            right: 15%;
            bottom: 12vh;
            width: 120px;
            height: 240px;
            display: flex;
            flex-direction: column;
            align-items: center;
        }
        .iron-candlestick-stem {
            width: 8px;
            height: 180px;
            background: linear-gradient(90deg, #111, #444, #111);
            border-left: 1px solid #000;
        }
        .iron-candlestick-base {
            width: 70px;
            height: 30px;
            background: linear-gradient(180deg, #222, #111);
            border: 1px solid #000;
            border-radius: 50% 50% 0 0;
            box-shadow: 0 8px 16px rgba(0,0,0,0.9);
        }
        .candlestick-bowl {
            width: 54px;
            height: 16px;
            background: linear-gradient(180deg, #caa148, #422f12);
            border: 2px solid #1a1003;
            border-radius: 50%;
            position: relative;
            display: flex;
            justify-content: center;
            align-items: center;
        }
        .candle-needle-socket {
            width: 24px;
            height: 35px;
            position: absolute;
            top: -28px;
            border: 1px dashed rgba(212, 175, 55, 0.45);
            box-sizing: border-box;
            transition: all 0.3s ease;
        }
        .candle-needle-socket.drag-over {
            background: rgba(255, 215, 0, 0.2);
            border-color: #ffffff;
            box-shadow: 0 0 15px #ffd700;
            transform: scale(1.1);
        }

        
        .candle-spawn-anchor {
            position: absolute;
            left: 30%;
            bottom: 8vh;
            width: 80px;
            height: 160px;
            display: flex;
            justify-content: center;
            align-items: flex-end;
        }
        .church-wax-candle {
            width: 14px;
            height: 130px;
            background: linear-gradient(90deg, #b8860b, #faeed4 40%, #caa148 70%, #8a6508 100%);
            border: 1px solid #3d2b04;
            border-radius: 3px 3px 0 0;
            cursor: grab;
            position: relative;
            box-shadow: 0 10px 20px rgba(0,0,0,0.8), inset -2px 0 5px rgba(0,0,0,0.2);
            transform-origin: center bottom;
        }
        .church-wax-candle:active { cursor: grabbing; }
        .candle-wick {
            position: absolute;
            top: -6px; left: 5px;
            width: 2px; height: 6px;
            background: #111;
        }
        .wax-drop-1 {
            position: absolute; top: 15px; left: -2px; width: 4px; height: 25px;
            background: #faeed4; border-radius: 2px; opacity: 0.8;
        }
        .wax-drop-2 {
            position: absolute; top: 30px; right: -2px; width: 3px; height: 40px;
            background: #caa148; border-radius: 2px; opacity: 0.9;
        }

        
        .sacred-flame-core {
            display: none;
            position: absolute;
            top: -34px; left: -4px;
            width: 20px; height: 36px;
            z-index: 99;
            transform-origin: center bottom;
            pointer-events: none;
        }
        .flame-outer {
            position: absolute; width: 100%; height: 100%;
            background: radial-gradient(ellipse at bottom, rgba(255,255,255,1) 0%, rgba(255,140,0,0.8) 50%, rgba(255,0,0,0) 100%);
            border-radius: 50% 50% 20% 20% / 60% 60% 40% 40%;
            box-shadow: 0 0 30px #ff8c00, 0 0 15px #ff0000;
            animation: flameWobble 0.1s ease-in-out infinite alternate;
        }
        .flame-aura {
            position: absolute; top: -10px; left: -10px; width: 40px; height: 56px;
            background: radial-gradient(circle, rgba(255,140,0,0.15) 0%, transparent 70%);
            mix-blend-mode: screen;
            pointer-events: none;
        }

       
        .gate-return-trigger {
            display: none;
            background: linear-gradient(180deg, #2b1406 0%, #120602 50%, #050201 100%);
            color: #ffd977 !important;
            border: 2px solid #caa148;
            outline: 1px solid #140702;
            outline-offset: -4px;
            padding: 14px 40px;
            font-size: 11px;
            font-weight: 900;
            cursor: pointer;
            letter-spacing: 4px;
            text-transform: uppercase;
            text-shadow: 0 2px 4px #000, 0 0 8px rgba(212, 175, 55, 0.5);
            box-shadow: 0 15px 35px rgba(0, 0, 0, 0.95), inset 0 0 15px rgba(184, 134, 11, 0.3);
            transition: all 0.4s cubic-bezier(0.25, 1, 0.5, 1);
            margin-bottom: 20px;
        }
        .gate-return-trigger:hover {
            color: #ffffff !important;
            border-color: #ffd977;
            box-shadow: 0 0 25px rgba(212, 175, 55, 0.8), inset 0 0 20px rgba(255, 215, 0, 0.2);
            transform: translateY(-2px);
        }

        @keyframes lampFlicker {
            0% { transform: scale(0.95) translateY(0); opacity: 0.9; }
            100% { transform: scale(1.05) translateY(-1px); opacity: 1; }
        }
        @keyframes flameWobble {
            0% { transform: scaleX(0.92) rotate(-1.5deg); }
            100% { transform: scaleX(1.08) rotate(1.5deg); }
        }
    </style>
</head>
<body>

    <div class="shrine-background"></div>
    <div class="shrine-shadow-overlay"></div>
    <div class="red-church-floor"><div class="floor-patina"></div></div>

    <div class="shrine-stage">
        <div class="instruction-banner">Привнесите даръ въ подсвѣчникъ </div>
        
        <div class="hanging-lamp-container">
            <div class="lamp-chain"></div>
            <div class="lamp-body">
                <div class="lamp-glass"></div>
                <div class="lamp-wick-flame"></div>
            </div>
        </div>

        <div class="altar-podium-zone">
            <div class="candlestick-bowl">
                <div class="candle-needle-socket" id="socket"></div>
            </div>
            <div class="iron-candlestick-stem"></div>
            <div class="iron-candlestick-base"></div>
        </div>

        <div class="candle-spawn-anchor">
            <div class="church-wax-candle" id="candle" draggable="true">
                <div class="candle-wick"></div>
                <div class="wax-drop-1"></div>
                <div class="wax-drop-2"></div>
                <div class="sacred-flame-core" id="flame">
                    <div class="flame-outer"></div>
                    <div class="flame-aura"></div>
                </div>
            </div>
        </div>

        <button class="gate-return-trigger" id="returnBtn">Воротиться въ Храмъ</button>
    </div>

    <script>
        const candle = document.getElementById('candle');
        const socket = document.getElementById('socket');
        const flame = document.getElementById('flame');
        const returnBtn = document.getElementById('returnBtn');

       
        candle.addEventListener('dragstart', (e) => {
            e.dataTransfer.setData('text/plain', 'ignite');
        });

        socket.addEventListener('dragover', (e) => e.preventDefault());
        socket.addEventListener('dragenter', () => socket.classList.add('drag-over'));
        socket.addEventListener('dragleave', () => socket.classList.remove('drag-over'));
        socket.addEventListener('drop', (e) => {
            e.preventDefault();
            socket.classList.remove('drag-over');
            igniteCandle();
        });

        
        let isMoving = false;
        candle.addEventListener('touchstart', () => { isMoving = true; });

        document.addEventListener('touchmove', (e) => {
            if (!isMoving) return;
            e.preventDefault();
            const touch = e.touches[0];

            candle.style.position = 'fixed';
            candle.style.left = (touch.clientX - 7) + 'px';
            candle.style.top = (touch.clientY - 65) + 'px';
            candle.style.zIndex = '9999';

            const rect = socket.getBoundingClientRect();
            if (touch.clientX >= rect.left && touch.clientX <= rect.right && touch.clientY >= rect.top && touch.clientY <= rect.bottom) {
                socket.classList.add('drag-over');
            } else {
                socket.classList.remove('drag-over');
            }
        }, { passive: false });

        document.addEventListener('touchend', (e) => {
            if (!isMoving) return;
            isMoving = false;
            socket.classList.remove('drag-over');

            const touch = e.changedTouches[0];
            const rect = socket.getBoundingClientRect();

            if (touch.clientX >= rect.left && touch.clientX <= rect.right && touch.clientY >= rect.top && touch.clientY <= rect.bottom) {
                igniteCandle();
            } else {
                candle.style.position = 'relative';
                candle.style.left = '0';
                candle.style.top = '0';
                candle.style.zIndex = '10';
            }
        });

              function igniteCandle() {
            socket.appendChild(candle);
            candle.style.position = 'absolute';
            candle.style.left = '5px';
            candle.style.top = '-115px';
            candle.setAttribute('draggable', 'false');
            flame.style.display = 'block';
            localStorage.setItem('ritual_candle_lit', 'true');
            localStorage.setItem('ritual_candle_lit_permanently', 'true'); 
            returnBtn.style.display = 'inline-block';
        }

        returnBtn.addEventListener('click', () => {
            window.location.href = 'index.html';
        });
    </script>

</body>
</html>
