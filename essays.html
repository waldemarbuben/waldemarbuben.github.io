<style id="edge-shelves-style">
/* ===== фильмы - лево / книги - право ===== */
.edge-shelf{
  position:absolute; top:0; z-index:1001;
  width:178px; height:1060px; box-sizing:border-box;
  padding:30px 20px 28px !important;
  display:flex; flex-direction:column;
}
.edge-shelf.edge-left{ right:calc(100% + 30px); }
.edge-shelf.edge-right{ left:calc(100% + 30px); }
.edge-shelf > .track-title{ flex:0 0 auto; margin-bottom:12px; font-size:.8em; padding:7px 16px; }
.edge-shelf > .track-title::before{left:5px} .edge-shelf > .track-title::after{right:5px}


.edge-shelf-scroll{
  position:relative; z-index:3; flex:1 1 auto; min-height:0;
  overflow-y:auto; overflow-x:hidden; padding:4px 6px 8px 2px;
  scrollbar-width:thin; scrollbar-color:#caa148 #140702;
}
.edge-shelf-scroll::-webkit-scrollbar{ width:9px; }
.edge-shelf-scroll::-webkit-scrollbar-track{ background:linear-gradient(90deg,#090301,#1a0a03,#090301); border-left:1px solid #4a2f0c; box-shadow:inset 0 0 6px #000; }
.edge-shelf-scroll::-webkit-scrollbar-thumb{ background:linear-gradient(180deg,#caa148 0%,#fff2be 30%,#9e742e 70%,#4a2d0b 100%); border:1px solid #140601; border-radius:3px; box-shadow:inset 1px 1px 1px rgba(255,255,255,.8),inset -1px -1px 2px rgba(0,0,0,.8); }

.shelf-item{
  display:block; text-align:center; text-decoration:none !important;
  margin:0 0 20px; padding-bottom:16px;
  border-bottom:1px solid rgba(125,89,35,.8);
  box-shadow:0 1px 0 rgba(0,0,0,.9);
  color:#f7dfa5;
}
.shelf-item:last-child{ margin-bottom:0; border-bottom:0; box-shadow:none; }
.shelf-cover{
  position:relative; display:block; width:100%; aspect-ratio:2/3; overflow:hidden; box-sizing:border-box;
  border:4px solid; border-color:#f0d584 #6b4512 #2a1506 #caa148;
  outline:2px solid #0a0402; outline-offset:0;
  background:linear-gradient(135deg,rgba(255,255,255,.1),transparent 40%),radial-gradient(circle at 50% 35%,#4a1f0b,#0e0508);
  box-shadow:0 0 0 3px #8a6428,0 0 0 4px #0a0402,0 10px 18px #000,inset 0 0 0 1px #000,inset 0 0 14px #000;
  transition:all .35s cubic-bezier(.2,.8,.2,1);
}
.shelf-cover > span{ 
  position:absolute; inset:0; display:flex; align-items:center; justify-content:center;
  font-size:2.4em; font-weight:900; color:#d9b45a; text-shadow:0 0 14px rgba(255,215,0,.5),0 2px 3px #000;
}
.shelf-cover > img{
  position:absolute; inset:0; width:100%; height:100%; object-fit:fill; display:block;
  filter:sepia(35%) contrast(1.15) brightness(.92); transition:filter .35s;
}
.shelf-item:hover .shelf-cover{ transform:translateY(-3px); box-shadow:0 0 0 3px #d4a748,0 0 0 4px #0a0402,0 14px 24px #000,0 0 22px rgba(255,215,0,.55),inset 0 0 0 1px #000,inset 0 0 14px #000; }

.shelf-name{
  display:block; margin-top:14px; font-size:.84em; font-weight:900; line-height:1.35; letter-spacing:.05em;
  color:#f7dfa5; text-shadow:0 1px 0 rgba(255,235,170,.45),0 2px 4px #000,0 0 12px rgba(212,175,55,.5);
}
.shelf-sub{ display:block; margin-top:3px; font-size:.72em; font-style:italic; letter-spacing:.03em; color:#e8d39a; text-shadow:0 1px 2px #000; }

.edge-shelf.is-open{ height:auto; }
.edge-shelf.is-open .edge-shelf-scroll{ overflow:visible; }
.shelf-item{ cursor:pointer; }
.edge-shelf.is-open .shelf-item{ cursor:alias; }
.shelf-item.is-picked .shelf-cover{ box-shadow:0 0 0 3px #ffe38f,0 0 0 4px #0a0402,0 14px 24px #000,0 0 28px rgba(255,215,0,.8),inset 0 0 0 1px #000,inset 0 0 14px #000; }

.shelf-toggle:hover{ color:#fff; filter:brightness(1.25); transform:translateY(-1px); }
.shelf-toggle:active{ transform:translateY(2px); }

<script>

(function(){
  var root=document.documentElement, ticking=false;
  function upd(){
    var h=Math.max(1,document.documentElement.scrollHeight-window.innerHeight);
    var p=Math.min(1,Math.max(0,(window.pageYOffset||document.documentElement.scrollTop||0)/h));
    root.style.setProperty('--dim',p.toFixed(3)); ticking=false;

  window.addEventListener('scroll',function(){ if(!ticking){ticking=true;requestAnimationFrame(upd);} },{passive:true});

     <script>
  document.addEventListener('DOMContentLoaded', () => {
    document.documentElement.style.scrollBehavior = "smooth";

    const flowerImages = [
        'flower3.webp',
        'flower4.webp',
        'flower5.webp',
        'flower7.webp',
        'flower8.webp',
        'flower12.webp',
        'flower13.webp',
    ];

    
    flowerImages.forEach(src => {
        const img = new Image();
        img.src = src;
    });

    const MAX_FLOWERS = 18;
    const flowers = [];
    let rafId = null;
    let lastTime = 0;

    function tick(now) {
        const dt = Math.min((now - lastTime) / 16.667, 3) || 1;
        lastTime = now;

        for (let i = flowers.length - 1; i >= 0; i--) {
            if (!flowers[i].step(dt)) {
                flowers[i].el.remove();
                flowers.splice(i, 1);
            }
        }

        if (flowers.length > 0) {
            rafId = requestAnimationFrame(tick);
        } else {
            rafId = null;
        }
    }

    function ensureLoop() {
        if (rafId === null) {
            lastTime = performance.now();
            rafId = requestAnimationFrame(tick);
        }
    }

    function createFlower() {
        if (flowers.length >= MAX_FLOWERS) return;

        const el = document.createElement('img');
        el.src = flowerImages[Math.floor(Math.random() * flowerImages.length)];

        
        el.style.position = 'fixed';
        el.style.left = '0';
        el.style.top = '0';
        el.style.zIndex = '100';
        el.style.pointerEvents = 'none';
        el.style.userSelect = 'none';
        el.style.willChange = 'transform, opacity';
        el.style.transform = 'translate3d(0,0,0)';
        el.style.visibility = 'hidden';

        const size = 30 + Math.random() * 40;
        el.style.width = size + 'px';
        el.style.height = 'auto';
        el.style.opacity = (0.5 + Math.random() * 0.4).toString();

        el.className = 'falling-flower';

        if (el.complete) {
            el.style.visibility = 'visible';
        } else {
            el.onload = () => { el.style.visibility = 'visible'; };
        }

        document.body.appendChild(el);

        const state = {
            el,
            size,
            x: Math.random() * window.innerWidth,
            y: -size - 20,
            speedY: 1.5 + Math.random() * 2,
            swaySpeed: 0.02 + Math.random() * 0.03,
            swayAmp: 1 + Math.random() * 2,
            swayStep: Math.random() * 100,
            rot: Math.random() * 360,
            rotSpeed: (Math.random() - 0.5) * 1.2,
        };

       
        state.step = function (dt) {
            this.y += this.speedY * dt;
            this.swayStep += this.swaySpeed * dt;
            this.x += Math.sin(this.swayStep) * this.swayAmp * dt;
            this.rot += this.rotSpeed * dt;

          
            this.el.style.transform = `translate3d(${this.x.toFixed(1)}px, ${this.y.toFixed(1)}px, 0) rotate(${this.rot.toFixed(1)}deg)`;

           
            return this.y <= window.innerHeight + 40;
        };

        flowers.push(state);
        ensureLoop();
    }

    function spawnWave() {
        const count = Math.floor(Math.random() * 3) + 1;
        for (let i = 0; i < count; i++) {
            setTimeout(createFlower, Math.random() * 2500);
        }

        const isLongDelay = Math.random() > 0.5;
        const nextDelay = isLongDelay
            ? (14000 + Math.random() * 8000)
            : (4000 + Math.random() * 4000);

        setTimeout(spawnWave, nextDelay);
    }

    setTimeout(spawnWave, 1000);
});
    </script>
