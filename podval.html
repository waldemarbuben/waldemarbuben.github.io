<!DOCTYPE HTML PUBLIC "-//W3C//DTD HTML 4.01 Transitional//EN" "http://w3.org">
<html lang="ru">
<head>
<meta http-equiv="Content-Type" content="text/html; charset=utf-8">
<title>Погреб в разработке — Hermeticum.ru</title>
<style type="text/css">
body {
  background-color: #050101;
  background-image: url("blackspace.jpg");
  background-repeat: repeat;
  color: #d6c5b3;
  font-family: "Times New Roman", Times, Georgia, serif;
  margin: 0;
  padding: 0;
  scrollbar-face-color: #4a0808;
  scrollbar-shadow-color: #140202;
  scrollbar-highlight-color: #9e1b1b;
  scrollbar-3dlight-color: #2b0404;
  scrollbar-darkshadow-color: #000000;
  scrollbar-track-color: #0a0101;
  scrollbar-arrow-color: #ff4747;
}


.outer-frame {
  background-color: #1c0404;
  border-top: 3px outset #8c1919;
  border-left: 3px outset #8c1919;
  border-right: 3px outset #420707;
  border-bottom: 3px outset #420707;
}


.inner-chamber {
  background-color: #0d0202;
  border-top: 2px inset #290404;
  border-left: 2px inset #290404;
  border-right: 2px inset #6e1212;
  border-bottom: 2px inset #6e1212;
}


.bar {
  background-color: #4a0808;
  border-top: 2px ridge #a61e1e;
  border-bottom: 2px ridge #590a0a;
  color: #f2dec8;
  font-size: 16px;
  font-weight: bold;
  letter-spacing: 2px;
  text-transform: uppercase;
  padding: 7px 12px;
  text-shadow: 2px 2px 1px #000000;
}

.ornament {
  color: #ff3b3b;
  font-size: 16px;
}

.text-well {
  padding: 20px 18px;
  font-size: 17px;
  text-align: center;
  line-height: 1.5;
  text-shadow: 1px 1px 1px #000000;
}


.btn-skeuo {
  background-color: #540a0a;
  border-top: 3px outset #b82525;
  border-left: 3px outset #b82525;
  border-right: 3px outset #360505;
  border-bottom: 3px outset #360505;
  border-radius: 0px;
  color: #f5e6d3;
  font-family: "Times New Roman", Times, serif;
  font-size: 15px;
  font-weight: bold;
  letter-spacing: 2px;
  text-transform: uppercase;
  padding: 8px 28px;
  cursor: pointer;
  text-shadow: 1px 1px 1px #000000;
}

.btn-skeuo:hover {
  background-color: #6e0e0e;
  color: #ffffff;
  border-top: 3px outset #d93232;
  border-left: 3px outset #d93232;
}

.btn-skeuo:active {
  background-color: #380505;
  border-top: 3px inset #290303;
  border-left: 3px inset #290303;
  border-right: 3px inset #8f1919;
  border-bottom: 3px inset #8f1919;
  padding: 9px 27px 7px 29px;
}


.footer-bar {
  margin-top: 14px;
  background-color: #1f0404;
  border: 2px ridge #7a1414;
  padding: 6px 14px;
  font-size: 13px;
  letter-spacing: 1px;
  display: inline-block;
}


.picture-frame {
  margin-top: 16px;
  background-color: #1a0303;
  border-top: 4px outset #8c1919;
  border-left: 4px outset #8c1919;
  border-right: 4px outset #420707;
  border-bottom: 4px outset #420707;
  padding: 8px;
  display: inline-block;
  max-width: 760px;
  width: 90%;
}

.bottom-img {
  display: block;
  width: 100%;
  height: auto;
  border: 2px inset #3b0606;
}

a {
  color: #ff4747;
  text-decoration: none;
  font-weight: bold;
  text-shadow: 1px 1px 1px #000000;
}
a:visited {
  color: #c92e2e;
}
a:hover {
  color: #ffffff;
  text-decoration: underline;
}
</style>
<script type="text/javascript">
function enterSite() {
  document.getElementById('gate-screen').style.display = 'none';
  document.getElementById('main-screen').style.display = 'block';
  var audio = document.getElementById('bg-music');
  if (audio) {
    audio.play();
  }
}
</script>
</head>
<body bgcolor="#050101" background="blackspace.jpg" text="#d6c5b3" link="#ff4747" vlink="#c92e2e" alink="#ffffff">

<audio id="bg-music" src="helene.mp3" loop="loop"></audio>

<table border="0" cellpadding="15" cellspacing="0" width="100%">
  <tr>
    <td align="center">
      <br>

  
      <div id="gate-screen">
        <table class="outer-frame" border="0" cellpadding="5" cellspacing="0" width="440" bgcolor="#1c0404">
          <tr>
            <td>
              <table class="inner-chamber" border="0" cellpadding="0" cellspacing="0" width="100%" bgcolor="#0d0202">
                <tr>
                  <td class="bar" bgcolor="#4a0808" align="center">
                    <span class="ornament">&#9768;</span> ЛЮК <span class="ornament">&#9768;</span>
                  </td>
                </tr>
                <tr>
                  <td class="text-well">
                    <i>Лестница ведёт в сырую темноту погреба...</i><br><br>
                    <input type="button" class="btn-skeuo" value="&#10016; ВОЙТИ &#10016;" onclick="enterSite()">
                  </td>
                </tr>
              </table>
            </td>
          </tr>
        </table>
      </div>

    
      <div id="main-screen" style="display: none;">
        <table class="outer-frame" border="0" cellpadding="5" cellspacing="0" width="440" bgcolor="#1c0404">
          <tr>
            <td>
              <table class="inner-chamber" border="0" cellpadding="0" cellspacing="0" width="100%" bgcolor="#0d0202">
                <tr>
                  <td class="bar" bgcolor="#4a0808" align="center">
                    <span class="ornament">&#9733;</span> ПОГРЕБ <span class="ornament">&#9733;</span>
                  </td>
                </tr>
                <tr>
                  <td class="text-well">
                    Погреб в разработке.
                  </td>
                </tr>
              </table>
            </td>
          </tr>
        </table>

        <br>
        <div class="footer-bar">
          <a href="index.html">&#171; Вылезти на hermeticum.ru &#187;</a>
        </div>

        <br>
        <div class="picture-frame">
          <img src="feetgod19.webp" alt="" class="bottom-img">
        </div>
      </div>

    </td>
  </tr>
</table>

</body>
</html>
