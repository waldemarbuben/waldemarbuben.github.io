<!DOCTYPE HTML PUBLIC "-//W3C//DTD HTML 4.01 Transitional//EN" "http://w3.org">
<html lang="ru">
<head>
<meta http-equiv="Content-Type" content="text/html; charset=utf-8">
<title>Погреб в разработке</title>
<style type="text/css">
body {
  background-color: #050101;
  background-image: url("blackspace.jpg");
  background-repeat: repeat;
  color: #d6c5b3;
  font-family: "Times New Roman", Times, serif;
  margin: 0;
  padding: 0;
}
.box {
  background-color: #140303;
  border: 1px solid #801515;
}
.bar {
  background-color: #540a0a;
  border-bottom: 1px solid #8a1717;
  color: #f0d8c0;
  font-size: 15px;
  font-weight: bold;
  padding: 6px 12px;
}
.text {
  padding: 20px 16px;
  font-size: 16px;
  text-align: center;
}
.btn-enter {
  background-color: #540a0a;
  border: 1px solid #b32424;
  color: #f0d8c0;
  font-family: "Times New Roman", Times, serif;
  font-size: 15px;
  font-weight: bold;
  padding: 6px 24px;
  cursor: pointer;
}
.btn-enter:hover {
  background-color: #7a1010;
  color: #ffffff;
}
.footer {
  padding-top: 14px;
  font-size: 13px;
  text-align: center;
}
.bottom-img {
  margin-top: 16px;
  border: 1px solid #801515;
}
a {
  color: #ff4747;
  text-decoration: underline;
}
a:visited {
  color: #b32424;
}
a:hover {
  color: #ffffff;
}
</style>
<script type="text/javascript">
function enterSite() {
  document.getElementById('gate-screen').style.display = 'none';
  document.getElementById('main-screen').style.display = 'block';
  var audio = document.getElementById('bg-music');
  if (audio) {
    audio.play();
  }
}
</script>
</head>
<body bgcolor="#050101" background="blackspace.jpg" text="#d6c5b3" link="#ff4747" vlink="#b32424" alink="#ffffff">

<audio id="bg-music" src="helene.mp3" loop="loop"></audio>

<table border="0" cellpadding="20" cellspacing="0" width="100%">
  <tr>
    <td align="center">
      <br><br>

      <div id="gate-screen">
        <table class="box" border="0" cellpadding="0" cellspacing="0" width="420" bgcolor="#140303">
          <tr>
            <td class="bar" bgcolor="#540a0a" align="left">
              <font color="#ff4747">&#10070;</font> Люк
            </td>
          </tr>
          <tr>
            <td class="text">
              Лестница в погреб<br><br>
              <input type="button" class="btn-enter" value="Войти" onclick="enterSite()">
            </td>
          </tr>
        </table>
      </div>

      <div id="main-screen" style="display: none;">
        <table class="box" border="0" cellpadding="0" cellspacing="0" width="420" bgcolor="#140303">
          <tr>
            <td class="bar" bgcolor="#540a0a" align="left">
              <font color="#ff4747">&#10070;</font> Погреб
            </td>
          </tr>
          <tr>
            <td class="text">
              Погреб в разработке.
            </td>
          </tr>
        </table>

        <div class="footer">
          <a href="index.html">Вылезти на hermeticum.ru</a><br>
          <img src="feetgod19.webp" alt="" class="bottom-img">
        </div>
      </div>

    </td>
  </tr>
</table>

</body>
</html>
